[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threatvision-ai"
version = "1.0.0"
description = "Production-grade, open-source AI-powered real-time threat detection computer vision framework"
readme = "README.md"
authors = [
    { name = "ThreatVision AI Team", email = "maintainers@threatvision.ai" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = [
    "computer-vision",
    "ai",
    "threat-detection",
    "security",
    "yolo",
    "rtsp",
    "video-analytics",
    "fastapi",
    "tracking",
    "object-detection"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=9.5.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
ml = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnxruntime>=1.15.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]

[project.scripts]
threatvision = "threatvision.cli.cli:main"

[project.urls]
Homepage = "https://github.com/threatvision/threatvision-ai"
Documentation = "https://threatvision.readthedocs.io"
Repository = "https://github.com/threatvision/threatvision-ai.git"
Issues = "https://github.com/threatvision/threatvision-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["threatvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=threatvision --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["numpy.*", "cv2.*", "reportlab.*", "ultralytics.*", "psutil.*", "yaml.*"]
ignore_missing_imports = true
ignore_errors = true
